kind = "web"
previewPath = "/"
title = "Mi-GUARD"
description = "Mi-GUARD is a HEATGUARD-branded dashboard for WP1–WP5: conceptual scenario layout, synthetic signal behavior, a local record prototype, and video and review handover status. It does not control real mine equipment or dispatch."
version = "1.0.0"
id = "artifacts/heatguard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26124

[services.development]
run = "pnpm --filter @workspace/heatguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/heatguard", "run", "build" ]
serve = "static"
publicDir = "artifacts/heatguard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26124"
BASE_PATH = "/"
